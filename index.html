<!DOCTYPE html>
<html lang="fr" translate="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="google" content="notranslate">
<title>Cercle</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1b74e8">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Cercle">
<style>
:root{--bg:#f0f2f5;--card:#fff;--tx:#1c1e21;--mu:#65676b;--ac:#1b74e8;--ln:#dfe2e6;--hv:#eef0f3;--them:#e9ebee}
@media (prefers-color-scheme:dark){:root{--bg:#18191a;--card:#242526;--tx:#e4e6eb;--mu:#a8abb2;--ln:#3a3b3c;--hv:#3a3b3c;--them:#3a3b3c}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,textarea{font:inherit;color:inherit}
header{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--ln);display:flex;align-items:center;gap:6px;padding:8px 12px}
.logo{font-weight:800;font-size:22px;color:var(--ac);margin-right:auto;letter-spacing:-.5px}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
main{max-width:640px;margin:0 auto;padding:12px}
.card{background:var(--card);border-radius:10px;padding:12px;margin-bottom:12px;box-shadow:0 1px 2px rgba(0,0,0,.12)}
.av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;flex:none;cursor:pointer}
.av.big{width:84px;height:84px;font-size:34px;border:4px solid var(--card)}
.row{display:flex;gap:10px;align-items:center}.top{align-items:flex-start}
.end{display:flex;justify-content:flex-end;margin-top:8px}
textarea,input{border:0;background:var(--hv);border-radius:18px;padding:9px 14px;min-width:0}
textarea{flex:1;resize:none}
.btn{background:var(--ac);color:#fff;border:0;border-radius:8px;padding:8px 16px;font-weight:600;cursor:pointer}
.lk{background:none;border:0;color:var(--ac);cursor:pointer;font-weight:600;padding:8px}
.meta{color:var(--mu);font-size:13px}
article p{margin:10px 0;white-space:pre-wrap;overflow-wrap:anywhere}
.bar{display:flex;border-top:1px solid var(--ln);margin-top:8px;padding-top:4px}
.act{flex:1;background:none;border:0;padding:8px;border-radius:6px;cursor:pointer;color:var(--mu);font-weight:600}
.act:hover{background:var(--hv)}.act.on{color:var(--ac)}
.cm{display:flex;gap:8px;margin-top:8px}.cm .av{width:30px;height:30px;font-size:12px}
.bub{background:var(--hv);border-radius:16px;padding:6px 12px;overflow-wrap:anywhere;position:relative}
.bub b{display:block;font-size:13px}
.cin{display:flex;gap:8px;margin-top:10px}.cin input,.msgin input{flex:1}
.del{margin-left:auto;background:none;border:0;color:var(--mu);cursor:pointer;font-size:18px;padding:0 6px}
.lnk{cursor:pointer}.lnk:hover{text-decoration:underline}
.empty{text-align:center;color:var(--mu);padding:28px 12px}
.auth{display:flex;flex-direction:column;gap:10px;margin-top:8vh}
.auth h1{margin:0;color:var(--ac);font-size:34px}.auth p{margin:0}
.err{color:#d93025;min-height:1.2em}
.chat{display:grid;grid-template-columns:230px 1fr;gap:12px;height:calc(100dvh - 200px);min-height:360px}
.list{overflow:auto;padding:6px}
.conv{display:flex;gap:10px;align-items:center;padding:8px;border-radius:8px;cursor:pointer;width:100%;background:none;border:0;text-align:left}
.conv:hover,.conv.on{background:var(--hv)}.conv span{min-width:0}
.conv .meta{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pane{display:flex;flex-direction:column;padding:0;overflow:hidden;margin:0}
.pane .tp{padding:10px 12px;border-bottom:1px solid var(--ln);font-weight:700}
.msgs{flex:1;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:6px}
.m{max-width:78%;padding:8px 12px;border-radius:18px;background:var(--them);overflow-wrap:anywhere}
.m.me{align-self:flex-end;background:var(--ac);color:#fff}
.msgin{display:flex;gap:8px;padding:10px;border-top:1px solid var(--ln)}
.back{display:none;background:none;border:0;color:var(--ac);cursor:pointer;font-weight:600}
.cover{height:110px;border-radius:10px 10px 0 0}.pc{padding:0}
.ph{display:flex;align-items:flex-end;gap:12px;padding:0 14px;margin-top:-34px}
.who{flex:1;min-width:0}.who h2{margin:0;font-size:20px;overflow-wrap:anywhere}
.bio{margin:10px 14px 14px;overflow-wrap:anywhere}
#en,#eb{display:block;width:100%;border-radius:10px;margin-bottom:8px}
.av{position:relative;overflow:hidden}
.av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.pic{display:block;width:100%;height:auto;max-height:520px;object-fit:cover;border-radius:8px;margin-top:8px}
.bd{position:absolute;top:0;right:-2px;background:#e0245e;color:#fff;border-radius:9px;font:700 11px/16px system-ui;min-width:16px;padding:0 4px;text-align:center;font-style:normal}
.bd[hidden]{display:none}
.nt{display:flex;gap:10px;align-items:center;padding:10px;border-radius:8px;cursor:pointer;width:100%;background:none;border:0;text-align:left}
.nt:hover{background:var(--hv)}.nt.new{background:color-mix(in srgb,var(--ac) 14%,transparent)}.nt .meta{display:block}
.cr{text-align:center;color:var(--mu);font-size:13px;padding:4px 12px 24px}
@media (max-width:640px){
 .chat{grid-template-columns:1fr}.chat.open .list{display:none}.chat:not(.open) .pane{display:none}.back{display:inline}
}
nav{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;background:var(--card);border-top:1px solid var(--ln);padding-bottom:env(safe-area-inset-bottom,0px)}
nav[hidden],nav button[hidden]{display:none}
nav button{flex:1;position:relative;background:none;border:0;padding:6px 2px 8px;cursor:pointer;color:var(--mu);font-size:11px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button span{font-size:20px;line-height:1.1}
nav button.on{color:var(--ac)}
nav .bd{top:2px;right:calc(50% - 26px)}
main{padding-bottom:84px}
.chip{display:inline-block;border:0;border-radius:14px;padding:5px 12px;font-size:13px;font-weight:600;cursor:pointer;background:var(--hv);color:var(--mu)}
.chip.in{background:color-mix(in srgb,#2e9d4f 20%,transparent);color:#2e9d4f}
.chip.out{background:color-mix(in srgb,#d9822b 20%,transparent);color:#d9822b}
.chip.sel{background:var(--ac);color:#fff}
.filters{display:flex;gap:8px;margin-bottom:12px;overflow-x:auto}
.ev h3{margin:8px 0 4px;font-size:18px}.ev .meta{font-size:14px}
.bigbtn{width:100%;margin-bottom:12px;padding:12px;border-radius:10px}
.seg{display:flex;gap:8px;margin:8px 0}
#et,#ep,#edt,#eds,#lt,#lp,#ls{display:block;width:100%;margin-bottom:8px;border-radius:10px}
</style>
</head>
<body>
<header><div class="logo">Cercle</div></header>
<main id="app"></main>
<nav id="nav" hidden>
<button id="t-feed"><span>💬</span>Fil</button>
<button id="t-ev"><span>🧭</span>Explorer</button>
<button id="t-msg"><span>✉️</span>Messages<i class="bd" id="bm" hidden></i></button>
<button id="t-nt"><span>🔔</span>Alertes<i class="bd" id="bd" hidden></i></button>
<button id="t-md" hidden><span>🛡️</span>Modé</button>
<button id="t-pf"><span>👤</span>Profil</button>
</nav>
<footer class="cr">Créé par Akilimali Dunia Christ-vie</footer>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/dist/umd/supabase.js"></script>
<script>
const sb=supabase.createClient('https://mrhhgsupvhxzgeqhhubo.supabase.co','sb_publishable_WmB3qmndLi8VIPgOn_Iaww_htNqQif4');
let U=null,P={},posts=[],cms=[],lks=[],msgs=[],reps=[],tab='feed',peer=null,evs=[],rsv=[],flt='all',showForm=false,eon=true,epend=null,fd={t:'',p:'',d:'',s:''},items=[],sect='ev',lflt='all',lform=false,lk='lost',lfd={t:'',p:'',s:''},lpend=null,pv=null,edit=false,mode='in',qv='',started=null,T,pend=null,nseen=0;
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const isAdmin=()=>!!(U&&P[U.id]&&P[U.id].is_admin);
const seenN=()=>+new Date((P[U.id]||{}).notif_seen_at||0);
const nm=id=>(P[id]&&P[id].name)||'Étudiant';
const col=id=>`hsl(${[...String(id)].reduce((a,c)=>a+c.charCodeAt(0),0)%360} 55% 42%)`;
const av=(id,c='')=>`<span class="av ${c}" data-p="${id}" style="background:${col(id)}">${P[id]&&P[id].avatar_url?`<img src="${esc(P[id].avatar_url)}" alt="">`:esc(nm(id)[0]||'?').toUpperCase()}</span>`;
function ago(t){const m=Math.round((Date.now()-new Date(t))/6e4);if(m<1)return'À l’instant';if(m<60)return`Il y a ${m} min`;const h=Math.round(m/60);return h<24?`Il y a ${h} h`:`Il y a ${Math.round(h/24)} j`}

async function load(){
 const r=await Promise.all([
  sb.from('profiles').select('*'),
  sb.from('posts').select('*').order('created_at',{ascending:false}).limit(60),
  sb.from('comments').select('*').order('created_at'),
  sb.from('likes').select('*'),
  sb.from('messages').select('*').order('created_at'),
  sb.from('reports').select('*').order('created_at',{ascending:false}),
  sb.from('events').select('*').gte('starts_at',new Date(Date.now()-108e5).toISOString()),
  sb.from('rsvps').select('*'),
  sb.from('lost_items').select('*').gte('created_at',new Date(Date.now()-5184e6).toISOString()).order('created_at',{ascending:false})]);
 P={};(r[0].data||[]).forEach(p=>P[p.id]=p);
 posts=r[1].data||[];cms=r[2].data||[];lks=r[3].data||[];msgs=r[4].data||[];reps=r[5].data||[];evs=r[6].data||[];rsv=r[7].data||[];items=r[8].data||[];
 render();
}
function shrink(f,max){return new Promise((ok,ko)=>{const im=new Image(),u=URL.createObjectURL(f);im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);c.toBlob(b=>b?ok(b):ko(new Error('Image illisible')),'image/jpeg',.82)};im.onerror=()=>ko(new Error('Image illisible'));im.src=u})}
async function upload(f,max){const b=await shrink(f,max),p=`${U.id}/${Date.now()}.jpg`;const{error}=await sb.storage.from('photos').upload(p,b,{contentType:'image/jpeg'});if(error)throw error;return sb.storage.from('photos').getPublicUrl(p).data.publicUrl}
function rmImg(p){const k=p&&p.image_url&&p.image_url.split('/photos/')[1];if(k)sb.storage.from('photos').remove([k])}
async function setAvatar(f){if(!f)return;try{const u=await upload(f,400);await run(sb.from('profiles').update({avatar_url:u}).eq('id',U.id))}catch(e){alert(e.message)}}
async function run(q){const{error}=await q;if(error)alert(error.message);await load()}

function authView(){return `<div class="card auth"><h1>Cercle</h1><p class="meta">Le réseau de ta classe.</p>
${mode==='up'?'<input id="nm" placeholder="Ton nom" maxlength="30" autocomplete="name">':''}
<input id="em" type="email" placeholder="E-mail" autocomplete="email">
<input id="pw" type="password" placeholder="Mot de passe (6 caractères min.)" autocomplete="${mode==='up'?'new-password':'current-password'}">
<button class="btn" id="go">${mode==='up'?'Créer mon compte':'Se connecter'}</button>
<p class="err" id="er"></p><button class="lk" id="sw">${mode==='up'?'J’ai déjà un compte':'Créer un compte'}</button></div>`}

function post(p){
 const l=lks.filter(x=>x.post_id===p.id),mine=l.some(x=>x.user_id===U.id),c=cms.filter(x=>x.post_id===p.id);
 return `<article class="card" data-id="${p.id}"><div class="row">${av(p.user_id)}<div><b class="lnk" data-p="${p.user_id}">${esc(nm(p.user_id))}</b><div class="meta">${ago(p.created_at)}</div></div>${p.user_id===U.id||isAdmin()?'<button class="del" data-a="del" aria-label="Supprimer la publication">×</button>':'<button class="del" data-a="rp" aria-label="Signaler la publication">🚩</button>'}</div>
 ${p.content?`<p>${esc(p.content)}</p>`:''}${p.image_url?`<img class="pic" src="${esc(p.image_url)}" alt="Photo de la publication" loading="lazy">`:''}<div class="meta">${l.length?l.length+' j’aime':''}${l.length&&c.length?' · ':''}${c.length?c.length+' commentaire'+(c.length>1?'s':''):''}</div>
 <div class="bar"><button class="act ${mine?'on':''}" data-a="like">${mine?'👍 Aimé':'👍 J’aime'}</button></div>
 ${c.map(x=>`<div class="cm">${av(x.user_id)}<div class="bub"><b class="lnk" data-p="${x.user_id}">${esc(nm(x.user_id))}</b>${esc(x.content)}${x.user_id===U.id||isAdmin()?`<button class="del" data-a="dc" data-c="${x.id}" aria-label="Supprimer le commentaire">×</button>`:`<button class="del" data-a="rc" data-c="${x.id}" aria-label="Signaler le commentaire">🚩</button>`}</div></div>`).join('')}
 <div class="cin"><input id="c${p.id}" placeholder="Écrire un commentaire…" maxlength="1000"><button class="btn" data-a="cm">Envoyer</button></div></article>`}

function feed(by){
 const L=posts.filter(p=>!by||p.user_id===by);
 return (by?'':`<div class="card"><div class="row top">${av(U.id)}<textarea id="np" rows="2" maxlength="2000" placeholder="Quoi de neuf ?"></textarea></div><div class="end" style="gap:8px;align-items:center"><label class="lk" for="pimg">📷 Photo</label><input type="file" id="pimg" accept="image/*" hidden>${pend?`<span class="meta">${esc(pend.name.slice(0,18))} <button class="del" id="pclr" aria-label="Retirer la photo">×</button></span>`:''}<button class="btn" id="pub">Publier</button></div></div>`)
 +(L.map(post).join('')||'<div class="empty">Aucune publication pour l’instant. Écris la première !</div>')}

function chat(){
 const last={};msgs.forEach(m=>{last[m.sender_id===U.id?m.receiver_id:m.sender_id]=m});
 const ts=id=>last[id]?+new Date(last[id].created_at):0;
 const o=Object.values(P).filter(p=>p.id!==U.id&&p.name.toLowerCase().includes(qv.toLowerCase())).sort((a,b)=>ts(b.id)-ts(a.id)||a.name.localeCompare(b.name));
 const list=`<input id="q" placeholder="Chercher un étudiant" value="${esc(qv)}" style="width:100%;margin-bottom:6px">`+
  (o.map(p=>`<button class="conv ${peer===p.id?'on':''}" data-m="${p.id}">${av(p.id)}<span><b>${esc(p.name)}</b><span class="meta">${last[p.id]?esc(last[p.id].content):'Nouvelle conversation'}</span></span></button>`).join('')||'<div class="empty">Personne trouvé.</div>');
 let pane='<div class="empty" style="margin:auto">Choisis une conversation.</div>';
 if(peer){const L=msgs.filter(m=>(m.sender_id===U.id&&m.receiver_id===peer)||(m.sender_id===peer&&m.receiver_id===U.id));
  pane=`<div class="tp"><button class="back" id="bk">‹ Retour</button>${esc(nm(peer))}</div><div class="msgs" id="ms">${L.map(m=>`<div class="m ${m.sender_id===U.id?'me':''}">${esc(m.content)}</div>`).join('')||'<div class="empty">Dis bonjour 👋</div>'}</div><div class="msgin"><input id="mi" placeholder="Écrire un message…" maxlength="2000"><button class="btn" id="snd">Envoyer</button></div>`}
 return `<div class="chat ${peer?'open':''}"><div class="card list">${list}</div><div class="card pane">${pane}</div></div>`}

function prof(){
 const id=pv||U.id,mine=id===U.id,p=P[id]||{},n=posts.filter(x=>x.user_id===id).length;
 return `<div class="card pc"><div class="cover" style="background:linear-gradient(135deg,${col(id)},#1b74e8)"></div>
 <div class="ph">${av(id,'big')}<div class="who"><h2>${esc(nm(id))}</h2><div class="meta">${n} publication${n>1?'s':''}</div></div>${mine?'<button class="btn" id="ed">Modifier</button>':`<button class="btn" data-m="${id}">Écrire</button>`}</div>
 <p class="bio">${esc(p.bio||'')||'Pas encore de bio.'}</p></div>
 ${edit&&mine?`<div class="card"><input id="en" maxlength="30" value="${esc(nm(id))}" aria-label="Nom"><textarea id="eb" rows="3" maxlength="160" aria-label="Bio" style="width:100%;display:block;border-radius:10px">${esc(p.bio||'')}</textarea><div class="end" style="gap:8px;align-items:center"><label class="lk" for="avin">📷 Changer la photo</label><input type="file" id="avin" accept="image/*" hidden><button class="btn" id="es">Enregistrer</button></div></div>`:''}
 ${mine?'<div class="end" style="margin:0 0 12px"><button class="lk" id="out">Se déconnecter</button></div>':''}${feed(id)}`}

function home(){
 const q=(k,t)=>`<button class="chip ${sect===k?'sel':''}" data-s="${k}">${t}</button>`;
 return `<div class="filters">${q('ev','🎉 Événements')}${q('lf','🔎 Objets perdus')}</div>`+(sect==='ev'?evtab():lftab())
}
function lfform(){return `<div class="card"><div class="seg"><button class="chip out ${lk==='lost'?'sel':''}" data-a="k0">😢 J’ai perdu</button><button class="chip in ${lk==='found'?'sel':''}" data-a="k1">🙌 J’ai trouvé</button></div>
 <input id="lt" maxlength="100" placeholder="Objet (ex : Clés avec porte-clé bleu)" value="${esc(lfd.t)}"><input id="lp" maxlength="100" placeholder="Où ? (ex : Bibliothèque, arrêt de bus)" value="${esc(lfd.p)}">
 <textarea id="ls" rows="2" maxlength="1000" placeholder="Détails (couleur, marque…)">${esc(lfd.s)}</textarea>
 <div class="end" style="gap:8px;align-items:center"><label class="lk" for="limg">📷 Photo</label><input type="file" id="limg" accept="image/*" hidden>${lpend?`<span class="meta">${esc(lpend.name.slice(0,18))} <button class="del" id="lclr" aria-label="Retirer">×</button></span>`:''}<button class="btn" id="lsv">Publier</button></div></div>`}
function lfc(i){
 const lost=i.kind==='lost',mine=i.user_id===U.id;
 return `<article class="card ev" data-id="${i.id}">${i.image_url?`<img class="pic" src="${esc(i.image_url)}" alt="Photo de l’objet" loading="lazy" style="margin:0 0 8px">`:''}
 <div class="row"><span class="chip ${lost?'out':'in'}">${lost?'😢 Perdu':'🙌 Trouvé'}</span><span class="meta">${ago(i.created_at)}</span>${mine||isAdmin()?'<button class="del" data-a="dit" aria-label="Supprimer">×</button>':'<button class="del" data-a="rit" aria-label="Signaler">🚩</button>'}</div>
 <h3>${esc(i.title)}</h3><div class="meta">📍 ${esc(i.place)}</div>
 ${i.description?`<p>${esc(i.description)}</p>`:''}
 <div class="meta">Par <b class="lnk" data-p="${i.user_id}">${esc(nm(i.user_id))}</b></div>
 <div class="bar" style="gap:8px">${mine?`<button class="btn" data-a="ires">✓ ${lost?'Retrouvé':'Rendu à son propriétaire'}</button>`:`<button class="btn" data-m="${i.user_id}">✉️ Contacter</button>`}</div></article>`}
function lftab(){
 const L=items.filter(i=>!i.resolved&&(lflt==='all'||i.kind===lflt));
 const f=(k,t)=>`<button class="chip ${lflt===k?'sel':''}" data-lf="${k}">${t}</button>`;
 return `<div class="filters">${f('all','Tout')}${f('lost','😢 Perdus')}${f('found','🙌 Trouvés')}</div><button class="btn bigbtn" id="nlf">${lform?'Fermer':'＋ Déclarer un objet'}</button>${lform?lfform():''}`+(L.map(lfc).join('')||'<div class="empty">Aucun objet déclaré pour l’instant.</div>')
}
function evform(){return `<div class="card"><input id="et" maxlength="100" placeholder="Titre (ex : Soirée de rentrée)" value="${esc(fd.t)}"><input id="ep" maxlength="100" placeholder="Lieu (ex : Amphi B, Café du centre)" value="${esc(fd.p)}"><input id="edt" type="datetime-local" value="${esc(fd.d)}" aria-label="Date et heure">
 <div class="seg"><button class="chip in ${eon?'sel':''}" data-a="on1">🏫 Campus</button><button class="chip out ${eon?'':'sel'}" data-a="on0">🌆 Hors campus</button></div>
 <textarea id="eds" rows="2" maxlength="1000" placeholder="Détails (facultatif)">${esc(fd.s)}</textarea>
 <div class="end" style="gap:8px;align-items:center"><label class="lk" for="eimg">📷 Affiche</label><input type="file" id="eimg" accept="image/*" hidden>${epend?`<span class="meta">${esc(epend.name.slice(0,18))} <button class="del" id="eclr" aria-label="Retirer">×</button></span>`:''}<button class="btn" id="esv">Publier</button></div></div>`}
function evc(e){
 const d=new Date(e.starts_at),g=rsv.filter(r=>r.event_id===e.id),me=g.some(r=>r.user_id===U.id);
 const when=d.toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'})+' à '+d.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});
 const who=g.slice(0,3).map(r=>nm(r.user_id).split(' ')[0]).join(', ');
 return `<article class="card ev" data-id="${e.id}">${e.image_url?`<img class="pic" src="${esc(e.image_url)}" alt="Affiche" loading="lazy" style="margin:0 0 8px">`:''}
 <div class="row"><span class="chip ${e.on_campus?'in':'out'}">${e.on_campus?'🏫 Campus':'🌆 Hors campus'}</span>${e.user_id===U.id||isAdmin()?'<button class="del" data-a="dev" aria-label="Supprimer l’événement">×</button>':'<button class="del" data-a="rev" aria-label="Signaler l’événement">🚩</button>'}</div>
 <h3>${esc(e.title)}</h3><div class="meta">📅 ${esc(when)}</div><div class="meta">📍 ${esc(e.place)}</div>
 ${e.description?`<p>${esc(e.description)}</p>`:''}
 <div class="meta">Par <b class="lnk" data-p="${e.user_id}">${esc(nm(e.user_id))}</b></div>
 <div class="bar" style="align-items:center;gap:8px"><span class="meta" style="flex:1">👥 ${g.length} participant${g.length>1?'s':''}${who?' : '+esc(who)+(g.length>3?'…':''):''}</span><button class="btn" data-a="go" style="${me?'background:#2e9d4f':''}">${me?'✓ J’y vais':'J’y vais'}</button></div></article>`}
function evtab(){
 const L=evs.filter(e=>+new Date(e.starts_at)>Date.now()-108e5&&(flt==='all'||(flt==='in')===e.on_campus)).sort((a,b)=>new Date(a.starts_at)-new Date(b.starts_at));
 const f=(k,t)=>`<button class="chip ${flt===k?'sel':''}" data-f="${k}">${t}</button>`;
 return `<div class="filters">${f('all','Tout')}${f('in','🏫 Sur le campus')}${f('out','🌆 Hors campus')}</div><button class="btn bigbtn" id="nev">${showForm?'Fermer':'＋ Proposer un événement'}</button>${showForm?evform():''}`+(L.map(evc).join('')||'<div class="empty">Aucun événement à venir. Propose le premier !</div>')
}
function notifs(){
 const mine=new Set(posts.filter(p=>p.user_id===U.id).map(p=>p.id)),L=[];
 lks.forEach(l=>{if(mine.has(l.post_id)&&l.user_id!==U.id)L.push({by:l.user_id,t:l.created_at,txt:'a aimé ta publication.'})});
 cms.forEach(c=>{if(mine.has(c.post_id)&&c.user_id!==U.id)L.push({by:c.user_id,t:c.created_at,txt:'a commenté : '+c.content.slice(0,60)})});
 const mev=new Set(evs.filter(e=>e.user_id===U.id).map(e=>e.id));
 rsv.forEach(r=>{if(mev.has(r.event_id)&&r.user_id!==U.id)L.push({by:r.user_id,t:r.created_at,txt:'participe à ton événement.',go:'ev'})});
 return L.sort((a,b)=>new Date(b.t)-new Date(a.t)).slice(0,50);
}
function ntv(){
 const L=notifs().map(n=>`<button class="nt ${+new Date(n.t)>nseen?'new':''}" data-go="${n.go||'feed'}">${av(n.by)}<span><b>${esc(nm(n.by))}</b> ${esc(n.txt)}<span class="meta">${ago(n.t)}</span></span></button>`).join('');
 return `<div class="card" style="padding:6px">${L||'<div class="empty">Aucune notification pour l’instant.</div>'}</div>`
}
function sync(){
 if(!U||!P[U.id])return;
 if(tab==='nt'){const N=notifs();if(N.length){const t=+new Date(N[0].t);if(t>seenN()){const iso=new Date(t).toISOString();P[U.id].notif_seen_at=iso;sb.from('profiles').update({notif_seen_at:iso}).eq('id',U.id).then(()=>{})}}}
 if(tab==='msg'&&peer&&msgs.some(m=>m.sender_id===peer&&m.receiver_id===U.id&&!m.read_at)){
  const iso=new Date().toISOString();msgs.forEach(m=>{if(m.sender_id===peer&&m.receiver_id===U.id&&!m.read_at)m.read_at=iso});
  sb.from('messages').update({read_at:iso}).eq('sender_id',peer).eq('receiver_id',U.id).is('read_at',null).then(()=>{})}
}
function mod(){
 const L=reps.map(r=>{
  const k=r.post_id?'post':r.event_id?'event':r.item_id?'item':'comment',i=r.post_id||r.event_id||r.item_id||r.comment_id,c=k==='post'?posts.find(x=>x.id===i):k==='event'?evs.find(x=>x.id===i):k==='item'?items.find(x=>x.id===i):cms.find(x=>x.id===i);
  return `<div class="card"><div class="meta">${{post:'Publication',event:'Événement',item:'Objet perdu/trouvé',comment:'Commentaire'}[k]} · signalé par ${esc(nm(r.reporter_id))} · ${ago(r.created_at)}</div>
  <p><b>${c?esc(nm(c.user_id)):'?'}</b> : ${c?esc(k==='event'||k==='item'?c.title+' — '+c.place:c.content):'Contenu introuvable'}</p>${c&&c.image_url?`<img class="pic" src="${esc(c.image_url)}" alt="">`:''}
  ${r.reason?`<div class="meta">Motif : ${esc(r.reason)}</div>`:''}
  <div class="end" style="gap:8px"><button class="lk" data-a="rig" data-r="${r.id}">Ignorer</button><button class="btn" data-a="mdel" data-t="${k}" data-i="${i}">Supprimer</button></div></div>`}).join('');
 return `<h3 style="margin:4px 0 12px">Signalements (${reps.length})</h3>`+(L||'<div class="empty">Aucun signalement. Tout est calme 🎉</div>')
}
function draw(){
 const A=$('#app');
 if(!U){$('#nav').hidden=true;A.innerHTML=authView();return}
 $('#nav').hidden=false;
 $('#t-md').hidden=!isAdmin();
 for(const k of['ev','feed','msg','nt','md','pf'])$('#t-'+k).className=tab===k?'on':'';
 A.innerHTML=tab==='ev'?home():tab==='feed'?feed():tab==='msg'?chat():tab==='nt'?ntv():tab==='md'&&isAdmin()?mod():prof();
 const un=notifs().filter(n=>+new Date(n.t)>seenN()).length,um=msgs.filter(m=>m.receiver_id===U.id&&!m.read_at).length;
 $('#bd').textContent=un;$('#bd').hidden=!un||tab==='nt';$('#bm').textContent=um;$('#bm').hidden=!um;
 document.title=(un+um?`(${un+um}) `:'')+'Cercle';
 const m=$('#ms');if(m)m.scrollTop=m.scrollHeight;
}
function render(){
 const a=document.activeElement,id=a&&a.id,v=a&&a.value;
 draw();sync();
 if(id&&v&&a.type!=='file'){const n=document.getElementById(id);if(n){n.value=v;n.focus()}}
}

async function start(){
 if(started===U.id)return;started=U.id;
 await load();
 const m=U.user_metadata&&U.user_metadata.name;
 if(m&&P[U.id]&&P[U.id].name===(U.email||'').split('@')[0]){await sb.from('profiles').update({name:m}).eq('id',U.id);P[U.id].name=m;render()}
 sb.channel('live').on('postgres_changes',{event:'*',schema:'public'},()=>{clearTimeout(T);T=setTimeout(load,300)}).subscribe();
}
sb.auth.onAuthStateChange((ev,s)=>{
 if(s&&s.user){U=s.user;start()}
 else{U=null;started=null;sb.removeAllChannels();draw()}
});
sb.auth.getSession().then(r=>{if(!r.data.session)draw()});

async function send(){const i=$('#mi'),v=i.value.trim();if(!v)return;i.value='';await run(sb.from('messages').insert({receiver_id:peer,content:v}))}
async function addComment(art){const i=art.querySelector('.cin input'),v=i.value.trim();if(!v)return;i.value='';await run(sb.from('comments').insert({post_id:+art.dataset.id,content:v}))}

document.addEventListener('click',async e=>{
 const t=e.target,c=s=>t.closest(s);
 if(c('#sw')){mode=mode==='up'?'in':'up';draw()}
 else if(c('#go')){
  const em=$('#em').value.trim(),pw=$('#pw').value,er=$('#er');er.textContent='';
  const r=mode==='up'?await sb.auth.signUp({email:em,password:pw,options:{data:{name:($('#nm').value||'').trim()}}}):await sb.auth.signInWithPassword({email:em,password:pw});
  if(r.error)er.textContent=r.error.message;
  else if(mode==='up'&&!r.data.session)er.textContent='Compte créé. Ouvre l’e-mail de confirmation, puis connecte-toi.';
 }
 else if(c('#t-ev')){tab='ev';render()}
 else if(c('#t-feed')){tab='feed';render()}
 else if(c('[data-s]')){sect=c('[data-s]').dataset.s;render()}
 else if(c('[data-lf]')){lflt=c('[data-lf]').dataset.lf;render()}
 else if(c('#nlf')){lform=!lform;render()}
 else if(c('#lclr')){lpend=null;render()}
 else if(c('#lsv')){
  const ti=lfd.t.trim(),pl=lfd.p.trim();
  if(!ti||!pl){alert('L’objet et le lieu sont obligatoires.');return}
  const b=c('#lsv');b.disabled=true;b.textContent='Envoi…';
  try{const u=lpend?await upload(lpend,1080):null;
   const{error}=await sb.from('lost_items').insert({kind:lk,title:ti,place:pl,description:lfd.s.trim(),image_url:u});
   if(error)throw error;lfd={t:'',p:'',s:''};lpend=null;lform=false;await load()}catch(er){alert(er.message);render()}}
 else if(c('[data-f]')){flt=c('[data-f]').dataset.f;render()}
 else if(c('#nev')){showForm=!showForm;render()}
 else if(c('#eclr')){epend=null;render()}
 else if(c('#esv')){
  const ti=fd.t.trim(),pl=fd.p.trim();
  if(!ti||!pl||!fd.d){alert('Le titre, le lieu et la date sont obligatoires.');return}
  if(new Date(fd.d)<Date.now()){alert('La date doit être dans le futur.');return}
  const b=c('#esv');b.disabled=true;b.textContent='Envoi…';
  try{const u=epend?await upload(epend,1080):null;
   const{error}=await sb.from('events').insert({title:ti,place:pl,on_campus:eon,starts_at:new Date(fd.d).toISOString(),description:fd.s.trim(),image_url:u});
   if(error)throw error;fd={t:'',p:'',d:'',s:''};epend=null;showForm=false;await load()}catch(er){alert(er.message);render()}}
 else if(c('#t-msg')){tab='msg';render()}
 else if(c('#t-nt')){tab='nt';nseen=seenN();render()}
 else if(c('#t-md')){tab='md';render()}
 else if(c('#t-pf')){tab='pf';pv=null;edit=false;render()}
 else if(c('#out'))sb.auth.signOut();
 else if(c('#pclr')){pend=null;render()}
 else if(c('#pub')){const v=($('#np').value||'').trim();if(!v&&!pend)return;const b=c('#pub');b.disabled=true;b.textContent='Envoi…';
  try{const u=pend?await upload(pend,1080):null;pend=null;$('#np').value='';await run(sb.from('posts').insert({content:v,image_url:u}))}catch(er){alert(er.message);render()}}
 else if(c('#bk')){peer=null;render()}
 else if(c('#snd'))send();
 else if(c('#ed')){edit=true;render()}
 else if(c('#es')){const n=$('#en').value.trim()||'Étudiant';edit=false;run(sb.from('profiles').update({name:n,bio:$('#eb').value.trim()}).eq('id',U.id))}
 else if(c('[data-p]')){pv=c('[data-p]').dataset.p;tab='pf';edit=false;render();scrollTo(0,0)}
 else if(c('[data-go]')){tab=c('[data-go]').dataset.go;render();scrollTo(0,0)}
 else if(c('[data-m]')){peer=c('[data-m]').dataset.m;tab='msg';render();const i=$('#mi');if(i)i.focus()}
 else if(t.dataset.a){
  const art=c('article'),id=art&&+art.dataset.id;
  if(t.dataset.a==='like'){const mine=lks.some(x=>x.post_id===id&&x.user_id===U.id);run(mine?sb.from('likes').delete().match({post_id:id,user_id:U.id}):sb.from('likes').insert({post_id:id}))}
  else if(t.dataset.a==='del'){if(confirm('Supprimer cette publication ?')){rmImg(posts.find(x=>x.id===id));run(sb.from('posts').delete().eq('id',id))}}
  else if(t.dataset.a==='dc')run(sb.from('comments').delete().eq('id',+t.dataset.c));
  else if(t.dataset.a==='cm')addComment(art);
  else if(t.dataset.a==='rp'||t.dataset.a==='rc'){
   const r=prompt('Pourquoi signales-tu ce contenu ? (facultatif)');if(r===null)return;
   const row=t.dataset.a==='rp'?{post_id:id,reason:r.trim()}:{comment_id:+t.dataset.c,reason:r.trim()};
   const{error}=await sb.from('reports').insert(row);alert(error?error.message:'Merci, ton signalement a été envoyé aux modérateurs.')}
  else if(t.dataset.a==='mdel'){if(confirm('Supprimer ce contenu ?')){if(t.dataset.t==='post')rmImg(posts.find(x=>x.id===+t.dataset.i));if(t.dataset.t==='event')rmImg(evs.find(x=>x.id===+t.dataset.i));if(t.dataset.t==='item')rmImg(items.find(x=>x.id===+t.dataset.i));run(sb.from({post:'posts',event:'events',item:'lost_items',comment:'comments'}[t.dataset.t]).delete().eq('id',+t.dataset.i))}}
  else if(t.dataset.a==='rig')run(sb.from('reports').delete().eq('id',+t.dataset.r));
  else if(t.dataset.a==='k0'||t.dataset.a==='k1'){lk=t.dataset.a==='k0'?'lost':'found';render()}
  else if(t.dataset.a==='ires')run(sb.from('lost_items').update({resolved:true}).eq('id',id));
  else if(t.dataset.a==='dit'){if(confirm('Supprimer cette annonce ?')){rmImg(items.find(x=>x.id===id));run(sb.from('lost_items').delete().eq('id',id))}}
  else if(t.dataset.a==='rit'){const r=prompt('Pourquoi signales-tu cette annonce ? (facultatif)');if(r===null)return;const{error}=await sb.from('reports').insert({item_id:id,reason:r.trim()});alert(error?error.message:'Merci, ton signalement a été envoyé aux modérateurs.')}
  else if(t.dataset.a==='on1'||t.dataset.a==='on0'){eon=t.dataset.a==='on1';render()}
  else if(t.dataset.a==='go'){const mine=rsv.some(r=>r.event_id===id&&r.user_id===U.id);run(mine?sb.from('rsvps').delete().match({event_id:id,user_id:U.id}):sb.from('rsvps').insert({event_id:id}))}
  else if(t.dataset.a==='dev'){if(confirm('Supprimer cet événement ?')){rmImg(evs.find(x=>x.id===id));run(sb.from('events').delete().eq('id',id))}}
  else if(t.dataset.a==='rev'){const r=prompt('Pourquoi signales-tu cet événement ? (facultatif)');if(r===null)return;const{error}=await sb.from('reports').insert({event_id:id,reason:r.trim()});alert(error?error.message:'Merci, ton signalement a été envoyé aux modérateurs.')}
 }
});
document.addEventListener('change',e=>{
 if(e.target.id==='pimg'){pend=e.target.files[0]||null;render()}
 else if(e.target.id==='limg'){lpend=e.target.files[0]||null;render()}
 else if(e.target.id==='eimg'){epend=e.target.files[0]||null;render()}
 else if(e.target.id==='avin')setAvatar(e.target.files[0]);
});
document.addEventListener('input',e=>{const m={et:'t',ep:'p',edt:'d',eds:'s'};if(m[e.target.id])fd[m[e.target.id]]=e.target.value;const m2={lt:'t',lp:'p',ls:'s'};if(m2[e.target.id])lfd[m2[e.target.id]]=e.target.value;if(e.target.id==='q'){qv=e.target.value;render()}});
document.addEventListener('keydown',e=>{
 if(e.key!=='Enter'||e.shiftKey)return;const t=e.target;
 if(t.id==='mi'){e.preventDefault();send()}
 else if(t.closest&&t.closest('.cin')){e.preventDefault();addComment(t.closest('article'))}
 else if(t.id==='pw'){e.preventDefault();$('#go').click()}
});
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
</body>
</html>
