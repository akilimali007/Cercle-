 const rc=sb.channel('call-'+U.id,{config:{private:true}});
 ['offer','answer','ice','end','decline','busy'].forEach(ev=>rc.on('broadcast',{event:ev},m=>onSig(ev,m.payload)));
 rc.subscribe();
}
function startRing(){stopRing();try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();AC.resume();
 const beep=()=>{const o=AC.createOscillator(),g=AC.createGain();o.frequency.value=440;g.gain.value=.15;o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+.4);navigator.vibrate&&navigator.vibrate([300,150,300])};
 beep();rt=setInterval(beep,2000)}catch(e){}}
function stopRing(){clearInterval(rt);rt=null}
const fmt=n=>{n=Math.round(n);return String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0')};
function stText(){return call.state==='in'?(call.video?'Appel vidéo entrant…':'Appel vocal entrant…'):call.state==='out'?'Appel en cours…':fmt((Date.now()-call.t0)/1000)}
function ui(){
 let el=document.getElementById('call');
 if(!call){if(el)el.remove();return}
 if(!el){el=document.createElement('div');el.id='call';document.body.appendChild(el)}
 el.className=(call.video?'vid ':'novid ')+call.state;
 const b=(k,cl,t,l)=>`<button class="${cl}" data-k="${k}" aria-label="${l}">${t}</button>`;
 el.innerHTML=`<video id="rv" autoplay playsinline></video><div class="cinfo">${av(call.peer,'big')}<h2>${esc(nm(call.peer))}</h2><div id="cst">${stText()}</div></div><video id="lv" autoplay playsinline muted></video><div class="cbar">${call.state==='in'?b('dec','red','✖','Refuser')+b('acc','grn','📞','Répondre'):b('mute','','🎤','Micro')+(call.video?b('cam','','📷','Caméra'):'')+b('end','red','✖','Raccrocher')}</div>`;
 const lv=$('#lv');if(lv&&call.stream)lv.srcObject=call.stream;
 const rv=$('#rv');if(rv&&call.remote){rv.srcObject=call.remote;rv.play&&rv.play().catch(()=>{})}
}
function mkPc(){
 const pc=new RTCPeerConnection(ICE);call.pc=pc;
 call.stream.getTracks().forEach(t=>pc.addTrack(t,call.stream));
 pc.ontrack=e=>{call.remote=e.streams[0];const rv=$('#rv');if(rv){rv.srcObject=call.remote;rv.play&&rv.play().catch(()=>{})}};
 pc.onicecandidate=e=>{if(e.candidate)sig(call.peer,'ice',{id:call.id,cand:e.candidate})};
 pc.onconnectionstatechange=()=>{if(call&&call.pc===pc&&(pc.connectionState==='failed'||pc.connectionState==='closed'))endCall(true,'Connexion perdue')};
}
async function media(video){
 try{return await navigator.mediaDevices.getUserMedia({audio:true,video:video?{facingMode:'user'}:false})}
 catch(e){if(video){try{return await navigator.mediaDevices.getUserMedia({audio:true})}catch(x){}}return null}
}
async function startCall(peer,video){
 if(call)return;
 if(!navigator.mediaDevices||!window.RTCPeerConnection){alert('Les appels ne sont pas pris en charge par ce navigateur.');return}
 const stream=await media(video);
 if(!stream){alert('Autorise le micro'+(video?' et la caméra':'')+' pour appeler.');return}
 call={id:Date.now()+'-'+Math.random().toString(36).slice(2),peer,video,state:'out',stream,pending:[],remoteSet:false};
 mkPc();ui();
 const c=call;
 c.to=setTimeout(()=>{if(call===c&&c.state==='out')endCall(true,'Pas de réponse')},45000);
 const o=await c.pc.createOffer();await c.pc.setLocalDescription(o);
 sig(peer,'offer',{id:c.id,video,sdp:c.pc.localDescription});
}
async function acceptCall(){
 if(!call||call.state!=='in')return;
 stopRing();const c=call;
 const stream=await media(c.video);
 if(!stream){alert('Autorise le micro pour répondre.');endCall(true);return}
 c.stream=stream;mkPc();
 await c.pc.setRemoteDescription(c.offer);c.remoteSet=true;
 for(const x of c.pending)try{await c.pc.addIceCandidate(x)}catch(e){}
 c.pending=[];
 const a=await c.pc.createAnswer();await c.pc.setLocalDescription(a);
 sig(c.peer,'answer',{id:c.id,sdp:c.pc.localDescription});
 c.state='on';c.t0=Date.now();ui();
 clearInterval(tick);tick=setInterval(()=>{const s=$('#cst');if(s&&call&&call.state==='on')s.textContent=stText()},1000);
}
function endCall(notify,msg){
 if(!call)return;
 const c=call;call=null;stopRing();clearTimeout(c.to);clearInterval(tick);
 if(notify)sig(c.peer,c.state==='in'?'decline':'end',{id:c.id});
 if(notify&&c.state==='out')sb.from('messages').insert({receiver_id:c.peer,content:c.video?'📹 Appel vidéo manqué':'📞 Appel manqué'}).then(()=>{});
 if(notify&&c.state==='on')sb.from('messages').insert({receiver_id:c.peer,content:'📞 Appel terminé · '+fmt((Date.now()-c.t0)/1000)}).then(()=>{});
 try{c.stream&&c.stream.getTracks().forEach(t=>t.stop());c.pc&&c.pc.close()}catch(e){}
 ui();if(msg)toast(msg);
}
async function onSig(ev,p){
 if(!p||!U)return;
 if(ev==='offer'){
  if(call){sig(p.from,'busy',{id:p.id});return}
  call={id:p.id,peer:p.from,video:p.video,state:'in',offer:p.sdp,pending:[],remoteSet:false};
  startRing();ui();return;
 }
 if(!call||p.id!==call.id)return;
 if(ev==='answer'&&call.state==='out'){
  clearTimeout(call.to);
  await call.pc.setRemoteDescription(p.sdp);call.remoteSet=true;
  for(const x of call.pending)try{await call.pc.addIceCandidate(x)}catch(e){}
  call.pending=[];call.state='on';call.t0=Date.now();ui();
  clearInterval(tick);tick=setInterval(()=>{const s=$('#cst');if(s&&call&&call.state==='on')s.textContent=stText()},1000);
 }
 else if(ev==='ice'){if(call.remoteSet&&call.pc)try{await call.pc.addIceCandidate(p.cand)}catch(e){}else call.pending.push(p.cand)}
 else if(ev==='end')endCall(false,call.state==='in'?'Appel manqué':'Appel terminé');
 else if(ev==='decline')endCall(false,'Appel refusé');
 else if(ev==='busy')endCall(false,'Cette personne est déjà en appel');
}

function openStory(){
 closeStory();const st=storyGroup[storyIndex];if(!st)return;
 const group=storyGroup,idx=storyIndex,views=storyViews.filter(x=>String(x.status_id)===String(st.id)).length;
 const reacted=storyReactions.some(x=>String(x.status_id)===String(st.id)&&x.user_id===U.id);
 const ov=document.createElement('div');ov.className='status-view';ov.innerHTML=`<div class="story-progress">${group.map((x,i)=>`<i><b style="width:${i<idx?'100%':'0%'}"></b></i>`).join('')}</div><div class="story-head">${av(st.user_id)}<div><b>${esc(nm(st.user_id))}</b><div class="meta">${ago(st.created_at)}</div></div><button class="story-close" id="story-close" aria-label="Fermer">×</button></div><div class="story-stage">${st.image_url?`<img src="${esc(st.image_url)}" alt="Story de ${esc(nm(st.user_id))}">`:''}${st.video_url?`<video src="${esc(st.video_url)}" controls autoplay playsinline></video>`:''}${st.content?`<div class="story-text">${esc(st.content)}</div>`:''}<button class="story-nav prev" id="story-prev" aria-label="Story précédente"></button><button class="story-nav next" id="story-next" aria-label="Story suivante"></button></div><div class="story-actions"><span class="meta">👁 ${views+(st.user_id===U.id?0:1)} vues</span><span class="spacer"></span>${st.user_id===U.id||isAdmin()?`<button id="story-delete">Supprimer</button>`:`<button id="story-react">${reacted?'💜 Aimé':'♡ Réagir'}</button><button id="story-report">🚩 Signaler</button>`}</div>`;
 document.body.appendChild(ov);
 const bar=ov.querySelectorAll('.story-progress i b')[idx];let progress=0;const duration=st.video_url?15000:6000;
 const tick=()=>{progress=Math.min(100,progress+100/(duration/100));bar.style.width=progress+'%';if(progress>=100)nextStory(1)};
 storyTimer=setInterval(tick,100);
 const vid=ov.querySelector('video');if(vid){vid.onended=()=>nextStory(1);vid.onplay=()=>{clearInterval(storyTimer);storyTimer=null};vid.onpause=()=>{if(!storyTimer)storyTimer=setInterval(tick,100)}}
 ov.querySelector('#story-close').onclick=closeStory;ov.querySelector('#story-prev').onclick=()=>nextStory(-1);ov.querySelector('#story-next').onclick=()=>nextStory(1);
 const del=ov.querySelector('#story-delete');if(del)del.onclick=async()=>{if(confirm('Supprimer cet instant ?')){const{error}=await sb.from('statuses').delete().eq('id',st.id);closeStory();if(error)alert(error.message);await load()}};
 const react=ov.querySelector('#story-react');if(react)react.onclick=async()=>{const existing=storyReactions.find(x=>String(x.status_id)===String(st.id)&&x.user_id===U.id);const q=existing?sb.from('story_reactions').delete().eq('id',existing.id):sb.from('story_reactions').insert({status_id:st.id});const{error}=await q;if(error)alert('Réaction indisponible : '+error.message);else await load();closeStory();openStory()};
 const report=ov.querySelector('#story-report');if(report)report.onclick=async()=>{const reason=prompt('Pourquoi signaler cette story ? (contenu inapproprié, violence, harcèlement, autre)');if(reason===null)return;const{error}=await sb.from('reports').insert({status_id:st.id,reason:reason.trim()});alert(error?'Signalement impossible : '+error.message:'Signalement envoyé aux modérateurs.');if(!error)closeStory()};

}

 <div class="ph">${av(id,'big')}<div class="who"><h2>${esc(nm(id))}</h2><div class="meta">${n} publication${n>1?'s':''}</div></div>${mine?'<button class="btn" id="ed">Modifier</button>':`<button class="btn" data-follow="${id}">${isFollowing?'✓ Abonné':'＋ S’abonner'}</button><button class="lk" data-m="${id}">Écrire</button>`}</div>

  else if(t.dataset.a==='mdel'){if(confirm('Supprimer ce contenu ?')){if(t.dataset.t==='post')rmImg(posts.find(x=>x.id===+t.dataset.i));if(t.dataset.t==='event')rmImg(evs.find(x=>x.id===+t.dataset.i));if(t.dataset.t==='item')rmImg(items.find(x=>x.id===+t.dataset.i));run(sb.from({post:'posts',event:'events',item:'lost_items',comment:'comments',status:'statuses'}[t.dataset.t]).delete().eq('id',+t.dataset.i))}}
  else if(t.dataset.a==='rig')run(sb.from('reports').delete().eq('id',+t.dataset.r));
  else if(t.dataset.a==='k0'||t.dataset.a==='k1'){lk=t.dataset.a==='k0'?'lost':'found';render()}
  else if(t.dataset.a==='ires')run(sb.from('lost_items').update({resolved:true}).eq('id',id));
  else if(t.dataset.a==='dit'){if(confirm('Supprimer cette annonce ?')){rmImg(items.find(x=>x.id===id));run(sb.from('lost_items').delete().eq('id',id))}}
  else if(t.dataset.a==='rit'){const r=prompt('Pourquoi signales-tu cette annonce ? (facultatif)');if(r===null)return;const{error}=await sb.from('reports').insert({item_id:id,reason:r.trim()});alert(error?error.message:'Merci, ton signalement a été envoyé aux modérateurs.')}
  else if(t.dataset.a==='on1'||t.dataset.a==='on0'){eon=t.dataset.a==='on1';render()}
  else if(t.dataset.a==='go'){const mine=rsv.some(r=>r.event_id===id&&r.user_id===U.id);run(mine?sb.from('rsvps').delete().match({event_id:id,user_id:U.id}):sb.from('rsvps').insert({event_id:id}))}
  else if(t.dataset.a==='dev'){if(confirm('Supprimer cet événement ?')){rmImg(evs.find(x=>x.id===id));run(sb.from('events').delete().eq('id',id))}}
  else if(t.dataset.a==='rev'){const r=prompt('Pourquoi signales-tu cet événement ? (facultatif)');if(r===null)return;const{error}=await sb.from('reports').insert({event_id:id,reason:r.trim()});alert(error?error.message:'Merci, ton signalement a été envoyé aux modérateurs.')}
 }
});
document.addEventListener('change',e=>{
 if(e.target.id==='pimg'){pend=e.target.files[0]||null;if(pend)vpend=null;render()}
 else if(e.target.id==='pvid'){vpend=e.target.files[0]||null;if(vpend)pend=null;render()}
 else if(e.target.id==='limg'){lpend=e.target.files[0]||null;render()}
 else if(e.target.id==='eimg'){epend=e.target.files[0]||null;render()}
 else if(e.target.id==='avin')setAvatar(e.target.files[0]);
});
document.addEventListener('input',e=>{const m={et:'t',ep:'p',edt:'d',eds:'s'};if(m[e.target.id])fd[m[e.target.id]]=e.target.value;const m2={lt:'t',lp:'p',ls:'s'};if(m2[e.target.id])lfd[m2[e.target.id]]=e.target.value;const m3={anm:'n',aem:'e',apw:'p'};if(m3[e.target.id])ad[m3[e.target.id]]=e.target.value;if(e.target.id==='q'){qv=e.target.value;render()}});
document.addEventListener('keydown',e=>{
 if(document.querySelector('.status-view')){if(e.key==='Escape'){closeStory();return}if(e.key==='ArrowRight'){nextStory(1);return}if(e.key==='ArrowLeft'){nextStory(-1);return}}
 if(e.key!=='Enter'||e.shiftKey)return;const t=e.target;
 if(t.id==='mi'){e.preventDefault();send()}
 else if(t.closest&&t.closest('.cin')){e.preventDefault();addComment(t.closest('article'))}
 else if(t.id==='pw'){e.preventDefault();$('#go').click()}
 else if(t.id==='apw'){e.preventDefault();$('#agoacc').click()}
});
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
